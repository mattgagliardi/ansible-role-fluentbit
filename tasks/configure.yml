  when: ansible_os_family == 'Windows'
  tags:
    - fluentbit_configure

- name: Deploy Fluent Bit main config (Windows)
  ansible.windows.win_template:
    src: fluent-bit.conf.j2
    dest: "{{ fluentbit_windows_install_dir }}\\conf\\fluent-bit.conf"
  when: ansible_os_family == 'Windows'
