    dest: "{{ fluentbit_windows_install_dir }}\\conf\\filters.conf"
  when: ansible_os_family == 'Windows'
  notify: Restart fluent-bit
  tags:
    - fluentbit_configure

- name: Deploy Fluent Bit outputs config (Windows)
  ansible.windows.win_template:
    src: fluent-bit-outputs.conf.j2
    dest: "{{ fluentbit_windows_install_dir }}\\conf\\outputs.conf"
